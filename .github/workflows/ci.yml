name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '"' | tr ',' ' ')
          targets=$(sed -n 's/^targets = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '"' | tr ',' ' ')

          rustup toolchain install "$toolchain" \
            --profile minimal \
            $(printf '%s\n' "$components" | xargs -n1 printf -- '--component %s ') \
            $(printf '%s\n' "$targets" | xargs -n1 printf -- '--target %s ')

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      # .cargo/config.toml selects wasm32-wasip1. The test harness runs on the host,
      # where zellij-tile supplies no-op host functions.
      - name: Test
        run: |
          cargo test --target "$(rustc -vV | sed -n 's/^host: //p')"

      # zellij-plugin-snapshot is a command. [dependencies] would compile it into
      # the plugin wasm. https://github.com/fulldecent/zellij-plugin-snapshot
      # cargo install writes the binary to ~/.cargo/bin. Prepend that directory
      # so this step finds it when the runner PATH was set before the install.
      - name: Install zellij-plugin-snapshot
        run: cargo install zellij-plugin-snapshot --version 0.2.2 --locked

      - name: Snapshot
        run: |
          export PATH="${HOME}/.cargo/bin:${PATH}"
          sh tests/snapshot.sh

      - name: Build
        run: cargo build

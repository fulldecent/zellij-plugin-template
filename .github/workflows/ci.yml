name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '"' | tr ',' ' ')
          targets=$(sed -n 's/^targets = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '"' | tr ',' ' ')

          rustup toolchain install "$toolchain" \
            --profile minimal \
            $(printf '%s\n' "$components" | xargs -n1 printf -- '--component %s ') \
            $(printf '%s\n' "$targets" | xargs -n1 printf -- '--target %s ')

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      # .cargo/config.toml selects wasm32-wasip1. The test harness runs on the host,
      # where zellij-tile supplies no-op host functions.
      - name: Test
        run: |
          cargo test --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Build
        run: cargo build

# ModeUpdate supplies the session theme, Styling::from(default_palette()).
# Styling::default() is gray on gray. A Zellij session sends ModeUpdate, and
# that is the picture this snapshot records.
name: screenshot
plugin: ../target/wasm32-wasip1/release/plugin.wasm
geometry:
  rows: 4
  cols: 24
steps:
  - action: mode_update
    mode: normal
    session: demo
